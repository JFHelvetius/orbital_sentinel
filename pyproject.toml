[project]
name = "orbital-sentinel"
version = "0.1.0"
description = "Open-source platform for observing, propagating, and reasoning about the satellite population from public data."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Orbital Sentinel Contributors" },
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "pydantic >=2.7,<3",
    "duckdb >=1.0,<2",
    "pyarrow >=15,<20",
    # IANA tz database. Requerido en Windows porque Python no la trae nativa;
    # DuckDB/PyArrow la consultan al materializar timestamps con tz (ADR-0013).
    "tzdata; sys_platform == 'win32'",
    # Motor SGP4 (ADR-0005, ADR-0014). Port Python del Fortran de Vallado.
    "sgp4 >=2.20,<3",
]

[project.optional-dependencies]
dev = [
    "pytest >=8,<9",
    "pytest-cov >=5",
    "ruff >=0.4",
    "mypy >=1.10",
]
# Visualización 2D estática (groundtracks). Cubre el requisito de "visualización"
# de Fase 1 según ADR-0000. ADR-0008 Cesium sigue vigente para 3D interactivo
# en Fase 2+: estos extras no son alternativas, son escalas distintas.
viz = [
    "matplotlib >=3.7,<4",
]

[project.scripts]
orbital-sentinel = "orbital_sentinel.orchestration.cli:cli_entry_point"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbital_sentinel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "PL"]
ignore = [
    "PLR0913",  # too-many-arguments — kwargs-only APIs son intencionales
    "PLR0915",  # too-many-statements — predict_passes y screening tienen flujo lineal
    "PLR0912",  # too-many-branches — detect_anomalies tiene validación + cómputo en flujo lineal
    "PLR2004",  # magic-value-comparison — abundan en tests con literales esperados; señal no útil
    "RUF001",   # ambiguous-string — α, σ, etc. son intencionales en física
    "RUF002",   # ambiguous-docstring — idem en docstrings
    "RUF003",   # ambiguous-comment — idem en comentarios
    "UP017",    # datetime.UTC vs timezone.utc — pendiente sweep separado
    "PLC0415",  # import-outside-top-level — lazy imports deliberados (matplotlib, ciclos analytics)
]

[tool.ruff.lint.per-file-ignores]
# Tests: aceptamos asserts amplios y unpacks no usados como patrón de testing.
"tests/**" = ["B017", "RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "requires_secret(service): mark test as requiring a secret credential (skipped in public CI)",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Librerías de terceros sin PEP 561 stubs. Cubierto por el régimen
# de entorno declarado (ADR-0013). matplotlib es opcional (extra "viz")
# y no se instala en CI por defecto; lo tratamos como untyped.
module = ["pyarrow.*", "sgp4.*", "skyfield.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
