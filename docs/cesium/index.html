<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Orbital Sentinel · Cesium 3D</title>
  <script>
    window.CESIUM_BASE_URL = 'https://unpkg.com/cesium@1.119.0/Build/Cesium/';
  </script>
  <link rel="stylesheet" href="https://unpkg.com/cesium@1.119.0/Build/Cesium/Widgets/widgets.css">
  <script src="https://unpkg.com/cesium@1.119.0/Build/Cesium/Cesium.js"></script>
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .cesium-viewer-bottom { display: none !important; }
    .cesium-viewer-toolbar { top: 10px !important; right: 10px !important; }
    .cesium-button {
      background: rgba(21,27,44,.92) !important;
      border: 1px solid rgba(95,168,245,.3) !important;
      color: #5fa8f5 !important;
    }
    .cesium-button:hover { background: rgba(74,144,226,.3) !important; }
    .cesium-baseLayerPicker-dropDown {
      background: rgba(15,20,38,.98) !important;
      border: 1px solid rgba(95,168,245,.35) !important;
      box-shadow: 0 8px 32px rgba(0,0,0,.6);
      max-height: 540px !important;
      width: 320px !important;
      padding: 8px !important;
    }
    .cesium-baseLayerPicker-sectionTitle {
      color: #5fa8f5 !important;
      font-size: 11px !important;
      letter-spacing: .08em !important;
      text-transform: uppercase !important;
      font-weight: 600 !important;
      margin: 8px 4px 4px !important;
    }
    .cesium-baseLayerPicker-item {
      background: rgba(30,40,65,.5) !important;
      border: 1px solid rgba(95,168,245,.15) !important;
      border-radius: 6px !important;
      margin: 4px !important;
      padding: 4px !important;
      cursor: pointer !important;
    }
    .cesium-baseLayerPicker-item:hover {
      background: rgba(74,144,226,.2) !important;
      border-color: rgba(95,168,245,.5) !important;
    }
    .cesium-baseLayerPicker-selectedItem {
      background: rgba(74,144,226,.3) !important;
      border-color: rgba(95,168,245,.7) !important;
    }
    .cesium-baseLayerPicker-itemLabel {
      color: #e8eef7 !important;
      font-size: 12px !important;
      margin-left: 6px !important;
    }
    .cesium-baseLayerPicker-itemIcon {
      width: 48px !important;
      height: 48px !important;
      border-radius: 4px !important;
      object-fit: cover !important;
      border: 1px solid rgba(95,168,245,.3) !important;
    }
    .hud {
      position: absolute; top: 12px; left: 14px; z-index: 999;
      color: #e8eef7; padding: 10px 14px;
      background: rgba(15,25,50,.7);
      border: 1px solid rgba(95,168,245,.3);
      border-radius: 8px; backdrop-filter: blur(8px);
      pointer-events: auto;
      min-width: 220px;
    }
    .hud .title { font-size: 13px; font-weight: 700; letter-spacing: .03em; }
    .hud .sub { font-size: 10px; color: #5fa8f5; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
    .hud .lyr-panel {
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid rgba(95,168,245,.2);
      display: flex; flex-direction: column; gap: 6px;
    }
    .hud .lyr-panel .lp-title {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: .08em; color: rgba(180,200,230,.7);
      margin-bottom: 4px;
    }
    .hud .lyr-panel label {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: #e8eef7;
      cursor: pointer; user-select: none;
    }
    .hud .lyr-panel label:hover { color: #5fa8f5; }
    .hud .lyr-panel input[type="checkbox"] {
      width: 14px; height: 14px;
      accent-color: #5fa8f5; cursor: pointer;
    }
    /* Timeline + animation widgets — tono del design system */
    .cesium-viewer-timelineContainer {
      background: rgba(15,20,38,.92) !important;
      border-top: 1px solid rgba(95,168,245,.25) !important;
    }
    .cesium-viewer-animationContainer {
      background: rgba(15,20,38,.92) !important;
    }
    .cesium-animation-svgText { fill: #5fa8f5 !important; }
    .cesium-animation-themeNormal { fill: #1a2236 !important; }
    .cesium-animation-themeHover { fill: #2a3450 !important; }
    .cesium-animation-themeSelect { fill: #4a90e2 !important; }
    .cesium-animation-themeDisabled { fill: #2a3450 !important; }
    .cesium-animation-themePauseHovered { fill: #5fa8f5 !important; }
    .cesium-timeline-bar { background: rgba(15,20,38,.85) !important; }
    .loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: #5fa8f5; font-size: 14px;
      padding: 12px 18px; background: rgba(15,20,38,.85);
      border: 1px solid rgba(95,168,245,.3); border-radius: 6px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer">
    <div class="loading" id="loadingMsg">Cargando Cesium…</div>
  </div>
  <div class="hud">
    <div class="title">🌐 VISTA CESIUM · 3D fotorealístico</div>
    <div class="sub" id="hudSub">Esperando datos…</div>
    <div class="lyr-panel">
      <div class="lp-title">Capas del globo</div>
      <label>
        <input type="checkbox" id="lyr-labels">
        Etiquetas (países, ciudades)
      </label>
      <label>
        <input type="checkbox" id="lyr-atmosphere" checked>
        Atmósfera
      </label>
      <label>
        <input type="checkbox" id="lyr-lighting">
        Iluminación día/noche
      </label>
      <label>
        <input type="checkbox" id="lyr-footprint">
        Footprint (área visible)
      </label>
    </div>
  </div>
  <script>
    // ── Providers públicos (sin token) ───────────────────────────────
    function esriImagery() {
      return new Cesium.UrlTemplateImageryProvider({
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        credit: 'Esri · Maxar · Earthstar Geographics · USGS',
        maximumLevel: 19,
      });
    }
    function esriImageryWithLabels() {
      return [esriImagery(), new Cesium.UrlTemplateImageryProvider({
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
        credit: 'Esri Reference',
        maximumLevel: 19,
      })];
    }
    function esriTopo() {
      return new Cesium.UrlTemplateImageryProvider({
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
        credit: 'Esri Topo', maximumLevel: 19,
      });
    }
    function esriOcean() {
      return new Cesium.UrlTemplateImageryProvider({
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}',
        credit: 'Esri Ocean', maximumLevel: 13,
      });
    }
    function osm() {
      return new Cesium.OpenStreetMapImageryProvider({
        url: 'https://tile.openstreetmap.org/',
        credit: '© OpenStreetMap contributors',
      });
    }
    function nasaBlueMarble() {
      return new Cesium.UrlTemplateImageryProvider({
        url: 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_ShadedRelief_Bathymetry/default/EPSG3857_500m/{z}/{y}/{x}.jpeg',
        credit: 'NASA Earth Observatory — Blue Marble',
        tilingScheme: new Cesium.WebMercatorTilingScheme(),
        maximumLevel: 8,
      });
    }
    function natgeo() {
      return new Cesium.UrlTemplateImageryProvider({
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}',
        credit: 'Esri · National Geographic', maximumLevel: 16,
      });
    }

    // Iconos generados en canvas — siempre cargan (data:URL local), estilo
    // único por provider para que sean identificables a un vistazo.
    function makeIcon(style) {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const ctx = c.getContext('2d');
      // Disco circular tipo planeta
      ctx.save();
      ctx.beginPath();
      ctx.arc(32, 32, 30, 0, Math.PI * 2);
      ctx.clip();
      // Fondo según estilo
      if (style.bg) {
        const grad = ctx.createRadialGradient(28, 22, 4, 32, 32, 34);
        for (let i = 0; i < style.bg.length; i++)
          grad.addColorStop(i / (style.bg.length - 1), style.bg[i]);
        ctx.fillStyle = grad;
      } else {
        ctx.fillStyle = '#1a2236';
      }
      ctx.fillRect(0, 0, 64, 64);
      // Detalles (líneas tipo borde / formas tipo continente)
      if (style.shapes) {
        for (const s of style.shapes) {
          ctx.fillStyle = s.color;
          if (s.type === 'blob') {
            ctx.beginPath();
            ctx.ellipse(s.x, s.y, s.rx, s.ry, s.r || 0, 0, Math.PI * 2);
            ctx.fill();
          } else if (s.type === 'lines') {
            ctx.strokeStyle = s.color;
            ctx.lineWidth = s.w || 0.7;
            for (const [x1, y1, x2, y2] of s.lines) {
              ctx.beginPath();
              ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
              ctx.stroke();
            }
          }
        }
      }
      // Borde
      ctx.restore();
      ctx.strokeStyle = 'rgba(95,168,245,.45)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(32, 32, 30, 0, Math.PI * 2);
      ctx.stroke();
      return c.toDataURL('image/png');
    }
    const ICONS = {
      esriImagery: makeIcon({
        bg: ['#5a7a4e', '#3c5a78', '#0a2849'],
        shapes: [
          {type:'blob', color:'rgba(120,140,80,.85)', x:20, y:24, rx:11, ry:8},
          {type:'blob', color:'rgba(120,140,80,.85)', x:42, y:36, rx:14, ry:10},
          {type:'blob', color:'rgba(180,170,120,.7)', x:34, y:22, rx:7, ry:5},
        ],
      }),
      esriWithLabels: makeIcon({
        bg: ['#5a7a4e', '#3c5a78', '#0a2849'],
        shapes: [
          {type:'blob', color:'rgba(120,140,80,.85)', x:20, y:24, rx:11, ry:8},
          {type:'blob', color:'rgba(120,140,80,.85)', x:42, y:36, rx:14, ry:10},
          {type:'lines', color:'rgba(255,255,255,.5)', w:0.6, lines:[
            [12,32,52,32],[32,12,32,52],
          ]},
        ],
      }),
      blueMarble: makeIcon({
        bg: ['#2c5da5', '#143868', '#031026'],
        shapes: [
          // Continentes verdes más definidos
          {type:'blob', color:'rgba(110,150,90,.92)', x:20, y:25, rx:11, ry:9},
          {type:'blob', color:'rgba(110,150,90,.92)', x:43, y:36, rx:13, ry:10},
          {type:'blob', color:'rgba(150,180,120,.85)', x:32, y:46, rx:8, ry:6},
          // Casquete polar arctic
          {type:'blob', color:'rgba(240,245,255,.55)', x:32, y:12, rx:14, ry:4},
          // Reflejo atmosférico
          {type:'blob', color:'rgba(255,255,255,.18)', x:22, y:18, rx:9, ry:3},
        ],
      }),
      esriTopo: makeIcon({
        bg: ['#c8b78a', '#9a8855', '#5a4a28'],
        shapes: [
          {type:'lines', color:'rgba(80,60,30,.6)', w:0.8, lines:[
            [10,30,30,28],[28,28,48,32],[14,40,38,42],[36,44,54,40],
            [16,20,28,16],[30,16,48,22],
          ]},
        ],
      }),
      esriOcean: makeIcon({
        bg: ['#3470a0', '#1a4878', '#0a2050'],
        shapes: [
          {type:'lines', color:'rgba(180,210,240,.4)', w:0.6, lines:[
            [8,22,56,22],[8,32,56,32],[8,42,56,42],[8,52,56,52],
          ]},
        ],
      }),
      osm: makeIcon({
        bg: ['#f4e8c8', '#e0d4a8', '#c8b888'],
        shapes: [
          {type:'lines', color:'rgba(120,90,60,.65)', w:1.1, lines:[
            [8,32,56,32],[32,8,32,56],[16,16,48,48],[16,48,48,16],
          ]},
        ],
      }),
      natgeo: makeIcon({
        bg: ['#d8c8a0', '#a0a878', '#5a6a48'],
        shapes: [
          {type:'blob', color:'rgba(170,160,90,.7)', x:24, y:24, rx:10, ry:7},
          {type:'blob', color:'rgba(170,160,90,.7)', x:42, y:38, rx:11, ry:9},
          {type:'lines', color:'rgba(120,80,50,.5)', w:0.6, lines:[
            [10,38,30,40],[34,42,54,38],
          ]},
        ],
      }),
    };

    const imageryModels = [
      new Cesium.ProviderViewModel({
        name: 'Esri World Imagery',
        iconUrl: ICONS.esriImagery,
        tooltip: 'Imagery satelital fotorealística Esri/Maxar/USGS. Sin etiquetas.',
        creationFunction: esriImagery,
      }),
      new Cesium.ProviderViewModel({
        name: 'Esri + etiquetas',
        iconUrl: ICONS.esriWithLabels,
        tooltip: 'Imagery Esri con superposición de fronteras y nombres.',
        creationFunction: esriImageryWithLabels,
      }),
      new Cesium.ProviderViewModel({
        name: 'NASA Blue Marble',
        iconUrl: ICONS.blueMarble,
        tooltip: 'Blue Marble + Shaded Relief + Bathymetry (NASA EOSDIS).',
        creationFunction: nasaBlueMarble,
      }),
      new Cesium.ProviderViewModel({
        name: 'Esri Topográfico',
        iconUrl: ICONS.esriTopo,
        tooltip: 'Mapa topográfico mundial con relieve y geografía física.',
        creationFunction: esriTopo,
      }),
      new Cesium.ProviderViewModel({
        name: 'Esri Océanos',
        iconUrl: ICONS.esriOcean,
        tooltip: 'Batimetría oceánica.',
        creationFunction: esriOcean,
      }),
      new Cesium.ProviderViewModel({
        name: 'OpenStreetMap',
        iconUrl: ICONS.osm,
        tooltip: 'OSM clásico — estilo callejero.',
        creationFunction: osm,
      }),
      new Cesium.ProviderViewModel({
        name: 'National Geographic',
        iconUrl: ICONS.natgeo,
        tooltip: 'Estilo Nat Geo — mapa físico-político.',
        creationFunction: natgeo,
      }),
    ];

    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: true,
      timeline: true,
      baseLayerPicker: true,
      imageryProviderViewModels: imageryModels,
      selectedImageryProviderViewModel: imageryModels[0],
      terrainProviderViewModels: [],
      geocoder: false,
      homeButton: true,
      sceneModePicker: true,
      navigationHelpButton: false,
      fullscreenButton: true,
      infoBox: true,
      selectionIndicator: true,
      shouldAnimate: false,
    });
    try { viewer.cesiumWidget.creditContainer.style.display = 'none'; } catch (e) {}

    const scene = viewer.scene;
    scene.globe.enableLighting = false;
    scene.globe.showGroundAtmosphere = true;
    if (scene.globe.atmosphereLightIntensity !== undefined)
      scene.globe.atmosphereLightIntensity = 10.0;
    scene.skyAtmosphere.show = true;
    scene.skyAtmosphere.saturationShift = 0.05;
    scene.fog.enabled = true;
    scene.fog.density = 0.00006;
    scene.backgroundColor = Cesium.Color.fromCssColorString('#01020a');

    document.getElementById('hudSub').textContent = 'Esri World Imagery';

    // HUD dinámico: cambia el subtítulo al seleccionar otra capa de imagery
    try {
      Cesium.knockout
        .getObservable(viewer.baseLayerPicker.viewModel, 'selectedImagery')
        .subscribe(function (model) {
          if (model && model.name) {
            document.getElementById('hudSub').textContent = model.name;
          }
        });
    } catch (e) { /* sin subscriber, el HUD queda estático */ }

    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(0, 15, 28_000_000),
      orientation: { heading: 0, pitch: -Cesium.Math.PI_OVER_TWO, roll: 0 },
    });

    // Quita "Cargando" después del primer render
    let firstRenderDone = false;
    scene.postRender.addEventListener(function() {
      if (!firstRenderDone) {
        firstRenderDone = true;
        const m = document.getElementById('loadingMsg');
        if (m) m.style.display = 'none';
      }
    });

    // Flag para evitar resetear la cámara cada vez que llegue un payload
    let initialFlyDone = false;

    // Construye el HTML del infobox enriquecido para un satélite
    function buildDescription(t) {
      const rows = [];
      // Header con full name si está disponible
      if (t.full_name && t.full_name !== t.name) {
        rows.push(`<h3 style="margin:0 0 4px;">${t.name}</h3>`);
        rows.push(`<p style="margin:0 0 10px;color:#9bb;font-size:12px;">${t.full_name}</p>`);
      } else {
        rows.push(`<h3 style="margin:0 0 10px;">${t.name}</h3>`);
      }
      // Sección "Identificación"
      rows.push('<div style="display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;">');
      rows.push(`<b>NORAD:</b><span>${t.norad}</span>`);
      if (t.intl_id) rows.push(`<b>Internacional:</b><span>${t.intl_id}</span>`);
      if (t.sat_type) rows.push(`<b>Tipo:</b><span>${t.sat_type}</span>`);
      if (t.owner) rows.push(`<b>Operador:</b><span>${t.owner}</span>`);
      if (t.launch_date) rows.push(`<b>Lanzamiento:</b><span>${t.launch_date}${t.launch_site ? ' · '+t.launch_site : ''}</span>`);
      if (t.status) rows.push(`<b>Estado:</b><span>${t.status}</span>`);
      rows.push('</div>');
      // Sección "Órbita"
      rows.push('<h4 style="margin:14px 0 6px;font-size:13px;">Órbita</h4>');
      rows.push('<div style="display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;">');
      rows.push(`<b>Altitud:</b><span>${t.alt0.toFixed(0)} km</span>`);
      rows.push(`<b>Altitud media:</b><span>${t.alt_mean.toFixed(0)} km</span>`);
      rows.push(`<b>Inclinación:</b><span>${t.incl.toFixed(2)}°</span>`);
      rows.push(`<b>Período:</b><span>${t.period_min.toFixed(1)} min</span>`);
      rows.push('</div>');
      return rows.join('\n');
    }

    // Map norad → entity para luego adjuntar SampledPositionProperty
    let entityByNorad = {};

    // ── Render de satélites desde datos recibidos por postMessage ────
    function renderTracks(payload) {
      try {
        const { tracks, primary_norad, real_norads, extra_tracks, series, clock } = payload;
        const realSet = new Set(real_norads || []);

        viewer.entities.removeAll();
        entityByNorad = {};

        function addSat(t, opts) {
          const pos = Cesium.Cartesian3.fromDegrees(t.lon0, t.lat0, t.alt0 * 1000.0);
          const ent = viewer.entities.add({
            name: t.name,
            position: pos,
            point: {
              pixelSize: opts.size,
              color: opts.color,
              outlineColor: Cesium.Color.WHITE.withAlpha(0.8),
              outlineWidth: opts.outline,
              // Sin disableDepthTestDistance: el globo opaco oculta los
              // puntos que están al otro lado del planeta. Mejor para
              // navegación — no se ven entes "atrás" del globo confundiendo
              // al usuario.
            },
            label: opts.label ? {
              text: t.name,
              font: '11px Inter, sans-serif',
              fillColor: opts.labelColor,
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 2,
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              pixelOffset: new Cesium.Cartesian2(10, 0),
              showBackground: true,
              backgroundColor: new Cesium.Color(0.04, 0.06, 0.12, 0.75),
              backgroundPadding: new Cesium.Cartesian2(6, 4),
              // Labels también ocultos cuando están al otro lado del globo
            } : undefined,
            description: buildDescription(t),
          });

          if (t.lats && t.lats.length > 1 && opts.drawTrack) {
            const positions = [];
            for (let i = 0; i < t.lats.length; i++) {
              positions.push(t.lons[i]);
              positions.push(t.lats[i]);
              positions.push(t.alt0 * 1000.0);
            }
            viewer.entities.add({
              polyline: {
                positions: Cesium.Cartesian3.fromDegreesArrayHeights(positions),
                width: opts.trackWidth,
                material: opts.trackColor,
              },
            });
          }
          entityByNorad[t.norad] = ent;
          return ent;
        }

        (tracks || []).forEach(t => {
          const isPrimary = (t.norad === primary_norad);
          const isReal = realSet.has(t.norad);
          if (isPrimary) {
            addSat(t, {
              size: 18, color: Cesium.Color.fromCssColorString('#ffd700'),
              outline: 2, label: true,
              labelColor: Cesium.Color.fromCssColorString('#ffd700'),
              drawTrack: true, trackWidth: 2.5,
              trackColor: new Cesium.PolylineGlowMaterialProperty({
                color: Cesium.Color.fromCssColorString('#ffd700'),
                glowPower: 0.25,
              }),
            });
          } else if (isReal) {
            addSat(t, {
              size: 14, color: Cesium.Color.fromCssColorString('#ff3547'),
              outline: 2, label: true,
              labelColor: Cesium.Color.fromCssColorString('#ff7a85'),
              drawTrack: true, trackWidth: 2,
              trackColor: Cesium.Color.fromCssColorString('#ff3547').withAlpha(0.65),
            });
          } else if (!t.known) {
            addSat(t, {
              size: 10, color: Cesium.Color.fromCssColorString('#ffb300'),
              outline: 1.5, label: true,
              labelColor: Cesium.Color.fromCssColorString('#ffb300'),
              drawTrack: true, trackWidth: 1,
              trackColor: Cesium.Color.fromCssColorString('#ffb300').withAlpha(0.45),
            });
          } else {
            addSat(t, {
              size: 7, color: Cesium.Color.fromCssColorString('#7eff9e'),
              outline: 1, label: false,
              labelColor: Cesium.Color.WHITE,
              drawTrack: true, trackWidth: 0.8,
              trackColor: Cesium.Color.fromCssColorString('#7eff9e').withAlpha(0.35),
            });
          }
        });

        (extra_tracks || []).forEach(t => {
          addSat(t, {
            size: 12, color: Cesium.Color.fromCssColorString('#00d2c8'),
            outline: 1.5, label: true,
            labelColor: Cesium.Color.fromCssColorString('#00d2c8'),
            drawTrack: true, trackWidth: 1.5,
            trackColor: Cesium.Color.fromCssColorString('#00d2c8').withAlpha(0.55),
          });
        });

        // Vuela al primary SOLO en la primera carga. Las subsiguientes
        // (toggle de capas, refresh de datos) NO mueven la cámara, así
        // que el zoom/posición del usuario se conserva.
        if (!initialFlyDone) {
          const primary = (tracks || []).find(t => t.norad === primary_norad);
          if (primary) {
            setTimeout(function() {
              viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(
                  primary.lon0, primary.lat0, 22_000_000
                ),
                duration: 2.0,
              });
            }, 800);
          }
          initialFlyDone = true;
        }

        // ── Time slider (ADR-0008 roadmap #4) ────────────────────────
        // Si llegan series temporales, adjunta SampledPositionProperty
        // a cada entity importante y configura el reloj del viewer.
        if (series && clock && Object.keys(series).length > 0) {
          try {
            const start = Cesium.JulianDate.fromIso8601(clock.start_iso);
            const stop  = Cesium.JulianDate.fromIso8601(clock.stop_iso);
            const cur   = Cesium.JulianDate.fromIso8601(clock.current_iso || clock.start_iso);
            viewer.clock.startTime   = start.clone();
            viewer.clock.stopTime    = stop.clone();
            viewer.clock.currentTime = cur.clone();
            viewer.clock.clockRange  = Cesium.ClockRange.LOOP_STOP;
            viewer.clock.multiplier  = 60;   // 1 s real = 1 min sim
            viewer.clock.shouldAnimate = false;  // arranca pausado
            if (viewer.timeline) {
              viewer.timeline.zoomTo(start, stop);
            }
            for (const [norad, s] of Object.entries(series)) {
              const ent = entityByNorad[parseInt(norad)];
              if (!ent) continue;
              const prop = new Cesium.SampledPositionProperty();
              for (let i = 0; i < s.times.length; i++) {
                const t = Cesium.JulianDate.fromIso8601(s.times[i]);
                const p = Cesium.Cartesian3.fromDegrees(
                  s.positions[i][0], s.positions[i][1], s.positions[i][2] * 1000.0
                );
                prop.addSample(t, p);
              }
              ent.position = prop;
            }
            document.getElementById('hudSub').textContent =
              'Esri World Imagery · Animación temporal disponible';
          } catch (clockErr) {
            console.warn('series/clock setup failed:', clockErr);
          }
        }
      } catch (e) {
        console.error('renderTracks failed:', e);
      }
    }

    // ── Controles de capas DENTRO del iframe (no afectan al re-render
    // del wrapper Streamlit, así el zoom/cámara se preservan) ────────
    let labelsLayer = null;
    function makeReferenceOverlay() {
      return new Cesium.UrlTemplateImageryProvider({
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
        credit: 'Esri Reference · Boundaries and Places',
        maximumLevel: 19,
      });
    }

    document.getElementById('lyr-labels').addEventListener('change', function (e) {
      if (e.target.checked && !labelsLayer) {
        labelsLayer = viewer.imageryLayers.addImageryProvider(makeReferenceOverlay());
      } else if (!e.target.checked && labelsLayer) {
        viewer.imageryLayers.remove(labelsLayer, true);
        labelsLayer = null;
      }
    });

    document.getElementById('lyr-atmosphere').addEventListener('change', function (e) {
      scene.skyAtmosphere.show = e.target.checked;
      scene.globe.showGroundAtmosphere = e.target.checked;
    });

    document.getElementById('lyr-lighting').addEventListener('change', function (e) {
      scene.globe.enableLighting = e.target.checked;
    });

    // ── Footprint (área de cobertura visible desde el satélite) ──────
    // Para una altitud `h` sobre la superficie de un planeta de radio R,
    // el horizonte óptico (geométrico, sin atmósfera) cubre un casquete
    // esférico con ángulo medio α tal que cos α = R/(R+h).
    // El radio del círculo proyectado sobre la superficie es R·sin α.
    const EARTH_R_M = 6_371_000;
    function horizonRadiusMeters(altKm) {
      const R = EARTH_R_M;
      const h = altKm * 1000.0;
      const cosA = R / (R + h);
      const sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
      return R * sinA;
    }
    // Mantener footprints añadidos para poder quitarlos
    const footprintEntities = [];
    function clearFootprints() {
      footprintEntities.forEach(e => viewer.entities.remove(e));
      footprintEntities.length = 0;
    }
    function addFootprintFor(t, color) {
      const radius = horizonRadiusMeters(t.alt0);
      const ent = viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(t.lon0, t.lat0, 0),
        ellipse: {
          semiMajorAxis: radius,
          semiMinorAxis: radius,
          material: color.withAlpha(0.12),
          outline: true,
          outlineColor: color.withAlpha(0.7),
          outlineWidth: 1.5,
          height: 0,
          extrudedHeight: 0,
        },
      });
      footprintEntities.push(ent);
    }
    let lastTracksPayload = null;
    function repaintFootprints() {
      clearFootprints();
      if (!document.getElementById('lyr-footprint').checked) return;
      if (!lastTracksPayload) return;
      const { tracks, primary_norad, real_norads } = lastTracksPayload;
      const realSet = new Set(real_norads || []);
      (tracks || []).forEach(t => {
        if (t.norad === primary_norad) {
          addFootprintFor(t, Cesium.Color.fromCssColorString('#ffd700'));
        } else if (realSet.has(t.norad)) {
          addFootprintFor(t, Cesium.Color.fromCssColorString('#ff3547'));
        } else if (!t.known) {
          addFootprintFor(t, Cesium.Color.fromCssColorString('#ffb300'));
        }
      });
    }
    document.getElementById('lyr-footprint').addEventListener('change', repaintFootprints);

    // ── Recibe datos del parent via postMessage ──────────────────────
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'orbital-sentinel-tracks') {
        lastTracksPayload = event.data.payload;
        renderTracks(event.data.payload);
        repaintFootprints();
      }
    });

    // Avisar al parent que estamos listos
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'orbital-sentinel-ready' }, '*');
    }
  </script>
</body>
</html>
