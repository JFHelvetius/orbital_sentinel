name: publish-to-pypi

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Verify tag matches pyproject.toml version
        run: |
          PYPROJECT_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "pyproject.toml: $PYPROJECT_VERSION"
          echo "git tag:        $TAG_VERSION"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: refusing to publish."
            exit 1
          fi

      - name: Verify frozen reproducibility contract before publish
        run: |
          pip install -e ".[dev]"
          orbital-sentinel self-verify --strict

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
